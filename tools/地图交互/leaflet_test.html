<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>武汉旅游规划 - Leaflet 地图展示</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- 地图容器 -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <script>
    // 初始化地图 - 使用高德地图瓦片（推荐用于国内项目）
    const map = L.map('map').setView([30.5785, 114.2990], 13); // 武汉市中心经纬度

    // 添加高德地图瓦片图层（免费、中文友好）
    // 高德地图瓦片 URL 模板（标准街道图）
    L.tileLayer('https://webst02.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}', {
      attribution: '© <a href="https://www.amap.com/">高德地图</a> contributors',
      maxZoom: 18,
      minZoom: 3
    }).addTo(map);
    // 114.365446,
    // 30.561506,
    // 可选：添加一个标记（例如黄鹤楼）
    L.marker([30.561506, 114.365446]).addTo(map)
      .bindPopup('<b>黄鹤楼</b><br>武汉著名古迹')
      .openPopup();

    // 可选：添加一个圆形（示例范围）
    L.circle([30.5785, 114.2990], {
      color: 'red',
      fillColor: '#f03',
      fillOpacity: 0.5,
      radius: 5000 // 半径5公里
    }).addTo(map);

    // 可选：添加缩放控件和位置控件
    L.control.scale().addTo(map);
    L.control.locate({ position: 'topright' }).addTo(map);
  </script>
</body>
</html>
